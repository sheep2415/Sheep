<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고등학교 공부 문제 풀이 (국·영·수·과)</title>
    <!-- CSS 파일 연결 (기존 style.css 사용) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. 좌측 사이드바 (연파랑 영역) -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>고등 공부 문제 풀이</h1>
            <p>고1~고3 맞춤 국·영·수·과 문제 DB</p>
        </div>

        <h3 class="section-title">학습 학년 및 과목 선택</h3>
        <div class="filter-group">
            <label for="grade-select">학년 선택</label>
            <select id="grade-select" class="filter-select">
                <option value="all">전체 학년 (고1~고3)</option>
                <option value="high1">고등학교 1학년</option>
                <option value="high2">고등학교 2학년</option>
                <option value="high3">고등학교 3학년</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="subject-select">과목 선택</label>
            <select id="subject-select" class="filter-select">
                <option value="all">전체 과목 (국·영·수·과)</option>
                <option value="korean">국어</option>
                <option value="english">영어</option>
                <option value="math">수학</option>
                <option value="science">과학 (통합과학/물·화·생·지)</option>
            </select>
        </div>

        <h3 class="section-title">추천 빠른 문제 출제</h3>
        <ul class="quick-list">
            <li>
                <button class="quick-btn" onclick="requestQuickQuiz('high1', 'math')">
                    <span>고1 수학 - 이차방정식과 근</span>
                    <span class="badge">고1</span>
                </button>
            </li>
            <li>
                <button class="quick-btn" onclick="requestQuickQuiz('high1', 'korean')">
                    <span>고1 국어 - 수사법과 표현</span>
                    <span class="badge">고1</span>
                </button>
            </li>
            <li>
                <button class="quick-btn" onclick="requestQuickQuiz('high1', 'science')">
                    <span>고1 과학 - 주기율표와 18족</span>
                    <span class="badge">고1</span>
                </button>
            </li>
            <li>
                <button class="quick-btn" onclick="requestQuickQuiz('high2', 'english')">
                    <span>고2 영어 - 관계대명사 어법</span>
                    <span class="badge">고2</span>
                </button>
            </li>
            <li>
                <button class="quick-btn" onclick="requestQuickQuiz('high2', 'science')">
                    <span>고2 물리 - 뉴턴 운동 법칙</span>
                    <span class="badge">고2</span>
                </button>
            </li>
            <li>
                <button class="quick-btn" onclick="requestQuickQuiz('high3', 'math')">
                    <span>고3 수학 - 도함수와 극댓값</span>
                    <span class="badge">고3</span>
                </button>
            </li>
            <li>
                <button class="quick-btn" onclick="requestQuickQuiz('high3', 'korean')">
                    <span>고3 국어 - 비문학 추론 구조</span>
                    <span class="badge">고3</span>
                </button>
            </li>
            <li>
                <button class="quick-btn" onclick="requestQuickQuiz('high3', 'english')">
                    <span>고3 영어 - 수능 필수 어휘</span>
                    <span class="badge">고3</span>
                </button>
            </li>
        </ul>

        <h3 class="section-title">오늘의 학습 현황</h3>
        <table class="stats-table">
            <tr>
                <th>풀이 문제</th>
                <th>정답 수</th>
                <th>정답률</th>
            </tr>
            <tr>
                <td id="stat-total">0</td>
                <td id="stat-correct">0</td>
                <td id="stat-rate">0%</td>
            </tr>
        </table>

        <div style="margin-top: 20px;">
            <p style="font-size: 11px; color: #64748b;">
                * EBS 고교 강의 참고: <a href="https://www.ebsi.co.kr" target="_blank" style="color: #2563eb;">EBSi 포털 이동</a>
            </p>
        </div>
    </div>

    <!-- 2. 우측 메인 학습 영역 (연노랑 영역) -->
    <div class="main-workspace">
        <div class="main-header">
            <h2>📖 고등학교 문제 풀이 대화창</h2>
            <p>고1, 고2, 고3 국어·영어·수학·과학 문제를 대화 형태로 풀어보세요.</p>
        </div>

        <div id="chat-container" class="chat-container">
            <!-- 초기 안내 메시지 -->
            <div class="message ai">
                <div class="bubble">
                    <strong>안녕하세요! 고등학교 (국·영·수·과) 공부 도우미입니다. 📚</strong><br><br>
                    채팅창에 <strong>"고1 수학 문제 내줘"</strong>, <strong>
